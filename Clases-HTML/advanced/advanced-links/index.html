<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links (Advanced)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <form action="">
      <h2>Formulario de contacto</h2>
      <fieldset>
        <legend>INFORMACIÓN PERSONAL</legend>
        <!-- SIMPLE INPUTS -->
        <div class="form_input">
          <label for="nombre">Nombre completo</label>
          <input
            type="text"
            name="nombre"
            placeholder="Juan Domínguez"
            id="nombre"
          />
        </div>
        <div class="form_input">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            name="correo electrónico"
            placeholder="ejemplo@gmail.com"
            id="email"
          />
        </div>
        <div class="form_input">
          <label
            >Asunto
            <input
              type="text"
              name="asunto"
              placeholder="El asunto de tu mensaje"
            />
          </label>
        </div>
      </fieldset>
      <!-- SELECT & OPTION -->
      <div class="form_input">
        Tipo de usuario
        <label>
          <select name="type-of-user">
            <option value="user1">Seguidor</option>
            <option value="user2">Empresa</option>
            <option value="user3">Otros</option>
          </select>
        </label>
      </div>

      <!-- DATALIST & OPTION -->
      <div class="form_input">
        Referente
        <label>
          <input list="referente" name="referente" />
          <datalist id="referente">
            <option>Soy Dalto</option>
            <option>Una empresa</option>
            <option>Un amigo</option>
          </datalist>
        </label>
      </div>

      <!-- TEXTAREA -->
      <div class="form_input">
        <label for="mensaje">Mensaje</label>
        <textarea
          rows="8"
          placeholder="Dejá tu mensaje..."
          id="mensaje"
        ></textarea>
      </div>

      <!-- CHECKBOX  -->
      <div class="form_input">
        <label>
          <!-- El "blank" abría el enlace en una pestaña nueva. -->
          Acepto los <a href="terms.html" target="blank">términos y condiciones</a>
          <input type="checkbox" class="checkbox" />
        </label>
      </div>
    </form>
  </body>
</html>
