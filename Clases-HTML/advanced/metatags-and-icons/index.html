<!DOCTYPE html>
<!-- Para que el navegador entienda en qué lenguaje está la página -->
<html lang="es">
<head>
    <!-- Metatags: proporcionan información sobre nuestra web. No son visibles para el usuario promedio. -->
    <!-- Le dice al documento cual es la documentación que va a utilizar. Permite todos los caracteres de todos los idiomas -->
    <meta charset="UTF-8">
    <!-- width=device-width = Nuestra página va a estar adaptada a todos los dispositivos -->
    <!-- initial-scale=1.0 = Se encarga de que el dispositivo entre siempre con 100% de zoom (default) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metatags and Icons</title>
    <!-- Icono que aparece en la ventana de la página -->
    <!-- Suelen ser imágenes de 32x32 o de 64x64 -->
    <!-- RECOMENDADO: Agregar el type -->
    <link rel="icon" href="icono-sol.png" type="image.png">

    <meta name="description" content="Acá tenemos que poner una descripción de la página web que estamos desarrollando.">
    <!-- Palabras clave para que aparezca la página en un buscador. -->
    <meta name="keywords" content="frutas, fruta, banana, manzana">

    <meta name="author" content="Justina Rey">
    <!-- Etiqueta para que los motores de búsqueda la lean -->
    <!-- nofollow: para que no aparezca la página en los resultados de búsqueda -->
    <!-- nosnippet:  que no aparezca una parte de mi página en el motor de búsqueda-->
     <!-- noarchive: Google no puede almacenar nuestra página en el caché. Es útil para páginas con cambios constantes. -->
      <!-- noimageindex: que no aparezca la imagen de la página en Google Imágenes -->
    <meta name="robots" content="nofollow">
    <!-- Un título -->
    <meta name="title" content="Venta de frutas">
</head>
<body>

</body>
</html>
