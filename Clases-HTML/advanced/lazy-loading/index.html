<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Loading</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- El lazy loading sugiere que el contenido tiene que ir cargándose a medida que el usuario llega a cada sección -->
     <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Commodi fugit soluta est? Dolor beatae, reiciendis non vero est numquam molestias atque deserunt suscipit deleniti! Alias sapiente sint accusantium tenetur autem!
     </p>
     <!-- Si agregamos loading="lazy", la imagen se va a cargar después. Sirve para cuando hay muchas imágenes. -->
     <img src="imagenes/playa.jpeg" alt="Una playa" loading="lazy">
</body>
</html>
