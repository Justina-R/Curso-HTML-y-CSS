<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Details and Summary</title>
</head>
<body>
    <!-- Funciona como un menú desplegable -->
    <details>
        <!-- Título del menú -->
        <summary>Recetas para el invierno</summary>
        <!-- Elementos del menú desplegable -->
        <ul>
            <li>Guiso de lentejas</li>
            <li>Polenta con salsa</li>
        </ul>
    </details>
    <details>
        <summary>¿Cual es la mejor receta invernal?</summary>
        <p>Obviamente es el guiso. Saludos</p>
    </details>
</body>
</html>
