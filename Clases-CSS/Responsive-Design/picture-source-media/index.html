<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture, Source & Media</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <picture>
        <!-- Si el navegador admite este tipo de imagen (webp), que la ponga -->
        <source type="image/webp" srcset="img.webp">
        <!-- Ponemos diversas fuentes para que el navegador elija según el tamaño de la pantalla -->
        <source media="(max-width: 400px)" srcset="img-small.png">
        <source media="(max-width: 600px)" srcset="img-mediana.png">
        <!-- Si no cumple las condiciones anteriores (de media y type) muestra la siguiente imagen: -->
        <img src="img-original.png">
    </picture>
</body>
</html>
